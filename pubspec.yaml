name: intelligent_land_measurement
description: An intelligent land measurement application.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ==============================
  # Camera & Image/File Handling
  # ==============================
  image_picker: ^1.1.2
  file_picker: ^8.3.7
  image_cropper: ^8.1.0
  camera: ^0.12.0+2

  # ==============================
  # GPS & Location
  # ==============================
  geolocator: ^12.0.0
  permission_handler: ^11.4.0

  # ==============================
  # GPS Map
  # ==============================
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # ==============================
  # Search / Nominatim API & Backend Communication
  # ==============================
  http: ^1.6.0

  # ==============================
  # Local Storage
  # ==============================
  shared_preferences: ^2.2.2

  # ==============================
  # AR Measurement
  # ==============================
  ar_flutter_plugin_2: ^0.0.3

dependency_overrides:
  permission_handler: ^11.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  mongo_dart: ^0.10.10

flutter:
  uses-material-design: true